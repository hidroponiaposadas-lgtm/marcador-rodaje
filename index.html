<head>

<style>
/* Paleta en variables: cambiar acá para igualar la estética exacta de CRUDO Suite */
:root{--bg:#0b0d10;--card:#13171c;--line:#222833;--tx:#e8ebf0;--mut:#7d8696;--ac:#ff7a1a;--ok:#2fbf71;--bad:#e5484d;--blue:#4aa3ff;--warn:#f5c542;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(8px,env(safe-area-inset-top)) 10px calc(64px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px;letter-spacing:.6px}
.top b{color:var(--ac)}
#clock{font:700 44px/1 var(--mono);text-align:center;margin:6px 0 8px;letter-spacing:1px}
button,select,input{font:inherit;color:var(--tx)}
button{background:#1a2029;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600}
button:active{transform:scale(.97)}
select,input{background:#0e1216;border:1px solid var(--line);border-radius:10px;padding:9px;width:100%}
.ctl{display:grid;grid-template-columns:76px 76px minmax(0,1fr);gap:8px;margin-top:8px}
.ctl #go{font-size:20px;padding:20px 6px;white-space:normal;line-height:1.1;min-width:0}
.ctl select{font-size:20px;font-weight:800;padding:0 6px;border-radius:14px}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--mut);letter-spacing:.6px;font-weight:700}
.ctl label select{flex:1}
#go{background:var(--ac);border-color:var(--ac);color:#1a0d00;font-size:24px;font-weight:800;padding:24px 12px;border-radius:14px;letter-spacing:.5px}
#go.esp{background:#2a1d10;color:var(--ac);border-color:var(--ac)}
#go.rec{background:var(--bad);border-color:var(--bad);color:#fff}
#estado{margin:8px 0 0;min-height:0}
.esp-box{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dots{display:flex;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}
.dot.on{background:var(--ac);border-color:var(--ac)}
#meter{height:5px;background:#1a2029;border-radius:9px;overflow:hidden;margin-top:8px}
#meter i{display:block;height:100%;width:0;background:var(--ok)}
#cron{font:800 54px/1 var(--mono);text-align:center;color:var(--ok)}
.sub{text-align:center;color:var(--mut);font-size:12px;margin-top:2px}
#tl{position:relative;height:84px;margin:10px 0 8px;background:#0e1216;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#wf{position:absolute;inset:0;width:100%;height:100%}
#mks{position:absolute;inset:0}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ac);z-index:2}
.tk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;opacity:.9;z-index:1}
#alerta{background:var(--bad);color:#fff;font-weight:700;padding:10px;border-radius:10px;margin:8px 0;text-align:center}
#aviso{background:#2a2410;border:1px solid var(--warn);color:var(--warn);padding:8px 10px;border-radius:10px;margin:8px 0;font-size:13px;font-weight:600}
#rescate{background:#10261a;border:1px solid var(--ok);padding:10px;border-radius:10px;margin:8px 0}
#rescate .row{display:flex;gap:8px;margin-top:8px}#rescate .row button{flex:1;padding:12px}
#camShare button.ya,#camShare button.gris{background:#1a2029;color:var(--tx);border:1px solid var(--line);font-weight:600}
#camShare{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
#camShare button{flex:1 1 auto;padding:14px 10px;font-size:15px;background:var(--ok);color:#04210f;border:0;border-radius:12px;font-weight:800}
#quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#quick button{padding:26px 6px;font-size:20px;font-weight:800;border-radius:14px;border:0;color:#10131a}
#quick [data-mk=CORTAR_FRASE]{background:#ff7a1a}
#quick [data-mk=TAPAR_INSERT]{background:#4aa3ff}
#quick [data-mk=DESTACAR]{background:#f5c542}
#quick [data-mk=NOTA]{background:#9aa3b2}
#quick #back{grid-column:1/3;padding:14px;font-size:17px;background:#1a2029;color:var(--tx);border:1px solid var(--line)}
#quick #back.sel{border-color:var(--ac);color:var(--ac)}
.mk{display:grid;grid-template-columns:52px 1fr auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.mk .t{font:12px var(--mono);color:var(--mut)}
.mk input{padding:7px}
.mk .x{padding:5px 9px;color:var(--bad)}
.chip{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;margin-right:4px;color:#10131a}
h2{font-size:12px;margin:16px 0 4px;color:var(--mut);letter-spacing:.8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.reg{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.reg .n{font-weight:700}.reg .m{color:var(--mut);font-size:11px}
.reg button{padding:4px 9px}
.reg .d{color:var(--bad)}
.reg.no{opacity:.45}
.reg .a{color:var(--ok)}
details{margin-top:12px;color:var(--mut)}
details summary{cursor:pointer;font-size:12px;letter-spacing:.6px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.f label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0b0d10ee;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:560px;margin:0 auto}
.bar button{flex:1}
.bar .ex{background:var(--ac);color:#1a0d00;border-color:var(--ac);flex:2}
#ok{position:fixed;inset:0;background:var(--ok);color:#04210f;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
#ok b{font-size:38px;letter-spacing:1px}
#ok span{font:600 18px var(--mono);margin-top:10px}
#toast{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:#000;border:1px solid var(--ac);padding:8px 14px;border-radius:10px;z-index:30;display:none;max-width:90%;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="toast"></div>
<div id="ok"><b>✔ TOMA APROBADA</b><span id="okInfo"></span></div>

<div class="top"><span><b>CRUDO</b> · MARCADOR DE RODAJE</span><span id="prg"></span></div>
<div id="clock">--:--:--</div>
<div id="alerta" class="hide"></div>

<div id="estado"></div>

<div class="ctl">
  <label>ESCENA<select id="esc" aria-label="Escena"></select></label>
  <label>CAM<select id="cam" aria-label="Cámara (opcional)"></select></label>

</div>

<div id="rec" class="hide">
  <div id="tl"><canvas id="wf"></canvas><div id="mks"></div><div id="ph"></div></div>
  <div id="quick">
    <button data-mk="CORTAR_FRASE">✂ Cortar</button>
    <button data-mk="TAPAR_INSERT">🎞 Tapar</button>

  </div>
  <div id="mkl"></div>
</div>

<h2><span id="regT">REGISTRO</span></h2>
<div id="aviso" class="hide"></div>
<div id="camShare"></div>
<div id="reg"></div>

<details>
  <summary>AJUSTES</summary>
  <div class="f">
    <div><label>Programa Nº</label><input id="pNum" inputmode="numeric" placeholder="1326"></div>
    <div><label>Fecha</label><input id="pFecha" type="date"></div>
    <div style="grid-column:1/3"><label>Programa</label><input id="pNom"></div>
    <div style="grid-column:1/3"><label>Sensibilidad de palmadas (más a la izquierda = detecta más suave)</label><input id="umbral" type="range" min="10" max="80" step="5"></div>
    <div id="stInfo" class="sub" style="grid-column:1/3;text-align:left"></div>
    <button id="probar">Probar micrófono</button>
    <button id="borrar" style="color:var(--bad)">Borrar día</button>
  </div>
</details>

<div class="bar">
  <button id="copiar">Copiar</button>
  <button class="ex" id="exportar">⬇ EXPORTAR PARA CRUDO / FRANCO</button>
</div>

<script>
const KEY='crudo_marcador_v2';
const TIPOS={CORTAR_FRASE:{n:'✂ Cortar',c:'#ff7a1a',ph:'frase exacta, ej: quiero queso'},TAPAR_INSERT:{n:'🎞 Tapar',c:'#4aa3ff',ph:'insert, ej: lluvia'},DESTACAR:{n:'⭐ Dest.',c:'#f5c542',ph:'detalle (opcional)'},NOTA:{n:'📝 Nota',c:'#9aa3b2',ph:'nota'}};
const pad=n=>String(n).padStart(2,'0');
const $=id=>document.getElementById(id);
function hoy(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function isoLocal(d){const o=-d.getTimezoneOffset(),s=o>=0?'+':'-',a=Math.abs(o);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0')+s+pad(Math.floor(a/60))+':'+pad(a%60)}
function fmt(s){s=Math.max(0,s);const m=Math.floor(s/60),x=s-m*60;return pad(m)+':'+x.toFixed(1).padStart(4,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=$('toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2200)}

let S={prog:{num:'',nom:'Nuestro Agro',fecha:hoy()},umbral:.35,extra:[],extraEsc:[],esc:'1',cam:'',tomas:[],seq:1,act:null,back:false,rescate:null,respaldo:0};
/* Escena 1 · CAM 1 · T03. La CAM es opcional: con una sola cámara queda «Escena 1 · T03».
   La toma se cuenta por escena (y por cámara si hay): Escena 2 arranca en T01. */
function etiqueta(esc,cam){return (esc?'Escena '+esc:'')+(cam?(esc?' · ':'')+'CAM '+cam:'')}
function grupo(t,esc,cam){return String(t.escena||'')===String(esc||'')&&String(t.cam||'')===String(cam||'')}
function proxN(esc,cam){return S.tomas.filter(t=>grupo(t,esc,cam)).length+1}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}

/* ---------- Detector de 3 palmadas (puro, testeable) ---------- */
const Det={on:[],last:0,armed:true,rms:0.01,
  reset(){this.on=[];this.last=0;this.armed=true},
  feed(p,rms,now,umbral){
    if(p<umbral*0.5)this.armed=true;
    const hot=p>umbral&&p>this.rms*6;
    if(!hot)this.rms=this.rms*0.95+rms*0.05;
    if(hot&&this.armed&&now-this.last>=130){
      this.armed=false;this.last=now;
      this.on.push(now);this.on=this.on.filter(t=>now-t<=3500);
      if(this.on.length>=3){
        const a=this.on.slice(-3);
        if(a[1]-a[0]<=1600&&a[2]-a[1]<=1600){this.on=[];return a}
      }
    }
    return null;
  }
};

/* ---------- Micrófono, waveform y grabación ---------- */
let AC=null,AN=null,ST=null,LOOP=null,CB=null,PK=[],PK0=0,REC=null,CH=[],RTYPE='',WL=null;
const AUD={};
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('crudo_marcador',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('aud'))d.createObjectStore('aud');if(!d.objectStoreNames.contains('chk'))d.createObjectStore('chk')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function aPut(id,b){AUD[id]=b;try{const d=await idb();await req(d.transaction('aud','readwrite').objectStore('aud').put(b,id))}catch(e){}}
async function aDel(id){delete AUD[id];try{const d=await idb();await req(d.transaction('aud','readwrite').objectStore('aud').delete(id))}catch(e){}}
async function aClear(){for(const k in AUD)delete AUD[k];try{const d=await idb();await req(d.transaction('aud','readwrite').objectStore('aud').clear())}catch(e){}}
async function aLoad(){try{const d=await idb();const ks=await req(d.transaction('aud').objectStore('aud').getAllKeys());for(const k of ks){AUD[k]=await req(d.transaction('aud').objectStore('aud').get(k))}}catch(e){}}
/* trozos de audio guardados cada segundo, para recuperar una toma si la app se corta */
async function cPut(rid,i,b){try{const d=await idb();d.transaction('chk','readwrite').objectStore('chk').put(b,[rid,i])}catch(e){}}
async function cGet(rid){try{const d=await idb();return await req(d.transaction('chk').objectStore('chk').getAll(IDBKeyRange.bound([rid,0],[rid,Infinity])))}catch(e){return[]}}
async function cDel(rid){try{const d=await idb();d.transaction('chk','readwrite').objectStore('chk').delete(IDBKeyRange.bound([rid,0],[rid,Infinity]))}catch(e){}}
async function cClear(keep){try{const d=await idb();if(keep==null){d.transaction('chk','readwrite').objectStore('chk').clear();return}const ks=await req(d.transaction('chk').objectStore('chk').getAllKeys());const st=d.transaction('chk','readwrite').objectStore('chk');ks.forEach(k=>{if(k[0]!==keep)st.delete(k)})}catch(e){}}
function kb(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function alerta(t){const e=$('alerta');if(!e)return;e.textContent=t||'';e.classList.toggle('hide',!t)}
let WLP=false;async function wakeOn(){if(WLP)return;WLP=true;try{if(navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request("screen");WL.addEventListener('release',()=>{WL=null})}}catch(e){}WLP=false}
function wakeOff(){/* la pantalla queda encendida todo el tiempo que la app esté abierta */}

async function micOn(){
  if(AN){try{if(AC.state==='suspended')await AC.resume()}catch(e){}return true}
  try{
    ST=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const src=AC.createMediaStreamSource(ST);AN=AC.createAnalyser();AN.fftSize=1024;src.connect(AN);
    if(AC.state==='suspended')await AC.resume();
    AC.onstatechange=()=>{if(!S.act)return;if(AC.state==='running')alerta('');else alerta('⚠ El audio quedó en pausa por el sistema')};
    ST.getAudioTracks().forEach(tr=>{
      tr.onended=()=>{if(LOOP){clearInterval(LOOP);LOOP=null}AN=null;ST=null;if(S.act)alerta('⚠ El micrófono se cortó. Tocá FIN TOMA y empezá otra toma.')};
      tr.onmute=()=>{if(S.act)alerta('⚠ Micrófono silenciado por el sistema (llamada u otra app)')};
      tr.onunmute=()=>{if(S.act)alerta('')};
    });
    return true;
  }catch(e){return false}
}
/* Un solo bucle: junta picos para la waveform durante toda la toma y, si hay CB, detecta las 3 palmadas */
function bucle(){
  if(LOOP||!AN)return;
  const buf=new Float32Array(1024);
  LOOP=setInterval(()=>{
    AN.getFloatTimeDomainData(buf);
    let p=0,s=0;for(let i=0;i<buf.length;i++){const a=Math.abs(buf[i]);if(a>p)p=a;s+=a*a}
    const now=Date.now();
    const m=$('mtr');if(m)m.style.width=Math.min(100,p*100)+'%';
    if(PK0){const i=Math.floor((now-PK0)/50);if(i>=0&&i<400000&&!(PK[i]>=p))PK[i]=p}
    if(CB){const r=Det.feed(p,Math.sqrt(s/buf.length),now,S.umbral);pintarDots();if(r){const f=CB;CB=null;f(r)}}
  },8);
}
function parar(){if(LOOP){clearInterval(LOOP);LOOP=null}CB=null;PK0=0}
function recStart(){
  try{
    const tipos=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
    RTYPE=tipos.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    REC=new MediaRecorder(ST,RTYPE?{mimeType:RTYPE,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});
    CH=[];const rid=S.act.pulsado;let ci=0;
    REC.ondataavailable=e=>{
      if(e.data&&e.data.size){
        CH.push(e.data);cPut(rid,ci++,e.data);
        if(S.act&&S.act.pulsado===rid){S.act.ult=Date.now();S.act.rtype=(REC&&REC.mimeType)||RTYPE;if(S.act.fase==='grabando')save()}
      }
    };
    REC.start(1000);
  }catch(e){REC=null}
}
function recStop(){
  return new Promise(res=>{
    if(!REC||REC.state==='inactive'){res(null);return}
    const r=REC;
    r.onstop=()=>{const b=new Blob(CH,{type:r.mimeType||RTYPE||'audio/webm'});REC=null;CH=[];res(b)};
    try{r.stop()}catch(e){REC=null;res(null)}
  });
}
function recCancel(){if(REC&&REC.state!=='inactive'){REC.onstop=null;try{REC.stop()}catch(e){}}REC=null;CH=[]}

/* ---------- Flujo de toma ---------- */
let TICK=null;
async function iniciar(){
  if(!S.esc){toast('Elegí la ESCENA');$('esc').focus();return}
  if(S.act)return;
  S.act={esc:S.esc,cam:S.cam,fase:'esperando',pulsado:Date.now(),claps:[],t0:null,metodo:null,mk:[]};
  alerta('');wakeOn();render();
  const ok=await micOn();
  if(!ok){toast('Sin micrófono: usá "Palmada manual" (no habrá audio)');return}
  if(!S.act||S.act.fase!=='esperando')return;
  S.act.pulsado=Date.now();PK=[];PK0=S.act.pulsado;
  recStart();Det.reset();CB=r=>sincronizado(r,'audio');bucle();
}
function sincronizado(claps,metodo){
  if(!S.act||S.act.fase!=='esperando')return;
  CB=null;
  S.act.claps=claps;S.act.t0=claps.length?claps[claps.length-1]:Date.now();S.act.metodo=metodo;S.act.fase='grabando';
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  save();render();arrancarTick();
}
function manual(){sincronizado([],'manual')}
function cancelar(){const rid=S.act&&S.act.pulsado;parar();recCancel();wakeOff();alerta('');if(rid)cDel(rid);S.act=null;save();render()}
function secs(){return (Date.now()-S.act.t0)/1000}
function arrancarTick(){clearInterval(TICK);TICK=setInterval(tick,100);tick()}
function dibujar(t,win){
  const c=$('wf');if(!c)return;
  const W=c.clientWidth,H=c.clientHeight,dpr=(typeof window!=='undefined'&&window.devicePixelRatio)||1;
  if(!W||!H)return;
  if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const a=S.act;if(!a||!a.t0||!PK0)return;
  const base=(a.t0-PK0)/50;
  g.fillStyle='#2fbf71';
  for(let x=0;x<W;x++){
    const ts=x/W*win;if(ts>t)break;
    const i0=Math.floor(base+ts*20);let i1=Math.floor(base+((x+1)/W*win)*20);if(i1<=i0)i1=i0+1;
    let m=0;for(let j=Math.max(0,i0);j<i1;j++){const v=PK[j]||0;if(v>m)m=v}
    const h=Math.max(1,Math.min(1,Math.sqrt(m)*1.4)*H*0.9);
    g.fillRect(x,(H-h)/2,1,h);
  }
}
function tick(){
  if(!S.act||S.act.fase!=='grabando'||!$('cron'))return;
  const t=secs();$('cron').textContent=fmt(t);
  const win=Math.max(60,t);
  $('ph').style.left=Math.min(100,t/win*100)+'%';
  document.querySelectorAll('.tk').forEach(e=>{e.style.left=(+e.dataset.t/win*100)+'%'});
  dibujar(t,win);
}
function addMk(tipo){
  if(!S.act||S.act.fase!=='grabando')return;
  let t=secs()-(S.back?5:0);if(t<0)t=0;S.back=false;
  S.act.mk.push({id:S.seq++,t:+t.toFixed(2),tipo,detalle:'',accion:tipo==='CORTAR_FRASE'?'quitar':undefined});
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  save();render();
}
function nombre(esc,cam,n){return etiqueta(esc,cam)+' · T'+pad(n)}
/* nombre de archivo sin espacios ni «·» (audios): 1326_ESC01_CAM1_T03 */
function archivoBase(t){return (S.prog.num?S.prog.num.replace(/[^\w-]/g,'')+'_':'')+(t.escena?'ESC'+pad(t.escena)+'_':'')+(t.cam?'CAM'+t.cam+'_':'')+'T'+pad(t.n)}
function armarToma(a,dur,id){
  const esc=a.esc||'',n=proxN(esc,a.cam);
  const t={id,escena:esc,cam:a.cam||'',n,nombre:nombre(esc,a.cam,n),estado:'aprobada',
    inicio:isoLocal(new Date(a.t0)),pulsado:isoLocal(new Date(a.pulsado)),
    sincro:a.metodo,palmadas_seg:a.claps.map(c=>+((c-a.t0)/1000).toFixed(3)),
    duracion_seg:+dur.toFixed(2),
    marcadores:a.mk.slice().sort((x,y)=>x.t-y.t).map(m=>{const r={t_seg:m.t,tipo:m.tipo,detalle:m.detalle||''};if(m.accion)r.accion=m.accion;return r})};
  if(a.huecos&&a.huecos.length)t.huecos=a.huecos;
  return t;
}
function adjuntar(t,blob,a){
  const ext=/mp4/.test(blob.type)?'m4a':/ogg/.test(blob.type)?'ogg':'webm';
  t.audio={archivo:archivoBase(t)+'.'+ext,ext,tipo:blob.type,bytes:blob.size,offset_seg:+((a.t0-a.pulsado)/1000).toFixed(3)};
}
async function finalizar(){
  const a=S.act;if(!a||a.fase!=='grabando')return;
  a.fase='cerrando';clearInterval(TICK);
  const dur=secs(),id=S.seq++;
  const toma=armarToma(a,dur,id);
  const blob=await recStop();
  if(blob&&blob.size>0){adjuntar(toma,blob,a);await aPut(id,blob);cDel(a.pulsado)}
  parar();wakeOff();alerta('');
  S.tomas.push(toma);S.act=null;S.back=false;save();render();aprobada(toma);
}
function aprobada(t){
  const o=$('ok');if(!o)return;
  $('okInfo').textContent=t.nombre+' · '+fmt(t.duracion_seg)+(t.audio?' · audio '+kb(t.audio.bytes):' · sin audio');
  o.style.display='flex';clearTimeout(aprobada._t);aprobada._t=setTimeout(()=>o.style.display='none',1800);
  try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
}
/* ---------- Rescate de toma interrumpida ---------- */
async function recuperar(){
  const a=S.rescate;if(!a)return;
  const parts=await cGet(a.pulsado);
  const dur=Math.max(0,((a.ult||a.t0)-a.t0)/1000),id=S.seq++;
  const toma=armarToma(a,dur,id);toma.recuperada=true;
  if(parts.length){const blob=new Blob(parts,{type:a.rtype||'audio/webm'});if(blob.size>0){adjuntar(toma,blob,a);await aPut(id,blob)}}
  await cDel(a.pulsado);
  S.tomas.push(toma);S.rescate=null;save();render();toast('Toma recuperada: '+toma.nombre);
}
async function descartarRescate(){
  if(!S.rescate)return;
  if(!confirm('¿Descartar el audio y los marcadores de la toma interrumpida? No se puede deshacer.'))return;
  await cDel(S.rescate.pulsado);S.rescate=null;save();render();
}
/* ---------- Envío y respaldo ---------- */
function pendientes(){return S.tomas.filter(t=>t.audio&&!t.enviada&&t.estado==='aprobada')}
function descargar(files){files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()},i*400))}
function archivoDe(t){return new File([AUD[t.id]],t.audio.archivo,{type:(t.audio.tipo||'audio/mp4').split(';')[0]})}
async function compartirCam(cam){
  cam=cam==='_'?'':cam;                                      // «_» = tomas sin CAM (una sola cámara)
  const ts=S.tomas.filter(t=>String(t.cam||'')===cam&&t.estado==='aprobada'&&t.audio&&AUD[t.id])
    .sort((x,y)=>String(x.escena||'').localeCompare(String(y.escena||''),undefined,{numeric:true})||x.n-y.n);
  const lab=cam?'CAM '+cam:'Sin CAM';
  if(!ts.length)return toast('No hay audios aprobados de '+lab);
  const files=ts.map(archivoDe);
  try{
    if(navigator.canShare&&navigator.canShare({files})){
      await navigator.share({files,title:lab+(S.prog.num?' · '+S.prog.num:'')});
      ts.forEach(t=>t.enviada=true);save();render();return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  descargar(files);ts.forEach(t=>t.enviada=true);save();render();
  toast('Descargados '+files.length+' audios de '+lab);
}
async function respaldo(){
  const ts=S.tomas.filter(t=>t.audio&&AUD[t.id]);
  const files=ts.map(archivoDe);
  files.push(new File([JSON.stringify(build(),null,2)],nombreArchivo(),{type:'application/json'}));
  try{
    if(navigator.canShare&&navigator.canShare({files})){
      await navigator.share({files,title:'Respaldo '+(S.prog.num||'')});
      S.respaldo=Date.now();save();render();return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  descargar(files);S.respaldo=Date.now();save();render();
  toast('Respaldo descargado ('+files.length+' archivos)');
}
async function stInfo(){
  const e=$('stInfo');if(!e)return;
  let p=false;try{p=await navigator.storage.persisted()}catch(x){}
  const sa=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
  e.innerHTML='Almacenamiento permanente: <b>'+(p?'sí':'no')+'</b> · Abierta desde el ícono: <b>'+(sa?'sí':'no')+'</b>'+((!p||!sa)?'<br>Para no perder audios, abrí siempre la app desde el ícono de la pantalla de inicio.':'');
}

/* ---------- Render ---------- */
function pintarDots(){
  const n=Det.on.length;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<n));
}
function opcionesCam(){
  const nums=[];for(let i=1;i<=10;i++)nums.push(String(i));
  (S.extra||[]).forEach(x=>{if(!nums.includes(x))nums.push(x)});
  return `<option value=""${S.cam?'':' selected'}>–</option>`+nums.map(n=>`<option value="${n}"${S.cam===n?' selected':''}>${n}</option>`).join('')+'<option value="otra">Otra…</option>';
}
function opcionesEsc(){
  const nums=[];for(let i=1;i<=30;i++)nums.push(String(i));
  (S.extraEsc||[]).forEach(x=>{if(!nums.includes(x))nums.push(x)});
  if(S.esc&&!nums.includes(S.esc))nums.push(S.esc);
  return nums.map(n=>`<option value="${n}"${S.esc===n?' selected':''}>${n}</option>`).join('')+'<option value="otra">Otra…</option>';
}
function render(){
  if(!$('go'))return;
  const a=S.act;
  $('prg').textContent=(S.prog.num?'Nº '+S.prog.num+' · ':'')+S.prog.fecha;
  $('cam').innerHTML=opcionesCam();$('cam').disabled=!!a;
  $('esc').innerHTML=opcionesEsc();$('esc').disabled=!!a;
  const go=$('go');
  if(!a){go.textContent='INICIO TOMA';go.className='';}
  else if(a.fase==='esperando'){go.textContent='CANCELAR';go.className='esp';}
  else{go.textContent='FIN TOMA';go.className='rec';}
  const est=$('estado');
  if(a&&a.fase==='esperando'){
    est.innerHTML=`<div class="esp-box"><div><b>${esc(etiqueta(a.esc,a.cam))}</b> <span class="sub">esperando 3 palmadas…</span></div><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><button id="man">Palmada manual</button></div><div id="meter"><i id="mtr"></i></div>`;
    pintarDots();
  }else if(a){
    est.innerHTML=`<div id="cron">00:00.0</div><div class="sub">${esc(etiqueta(a.esc,a.cam))} · toma ${proxN(a.esc,a.cam)} · sync ${a.metodo==='audio'?'por palmadas ✔':'manual'}</div>`;
  }else est.innerHTML='';
  $('rec').classList.toggle('hide',!(a&&a.fase==='grabando'));
  if(a&&a.fase==='grabando'){
    document.querySelectorAll('#quick [data-mk]').forEach(b=>b.classList.remove('sel'));
    $('back').classList.toggle('sel',!!S.back);
    $('mks').innerHTML=a.mk.map(m=>`<i class="tk" data-t="${m.t}" style="background:${TIPOS[m.tipo].c}"></i>`).join('');
    $('mkl').innerHTML=a.mk.slice().reverse().map(m=>`<div class="mk" data-id="${m.id}"><span class="t">${fmt(m.t)}</span><span style="display:flex;gap:4px;align-items:center"><span class="chip" style="background:${TIPOS[m.tipo].c}">${TIPOS[m.tipo].n}</span>${m.tipo==='CORTAR_FRASE'?`<select data-acc="${m.id}" style="width:auto;padding:6px"><option value="quitar"${m.accion==='quitar'?' selected':''}>quitar</option><option value="conservar"${m.accion==='conservar'?' selected':''}>dejar</option></select>`:''}<input data-det="${m.id}" value="${esc(m.detalle)}" placeholder="${esc(TIPOS[m.tipo].ph)}"></span><button class="x" data-del="${m.id}">✕</button></div>`).join('');
    tick();
  }
  const cams={};S.tomas.forEach(t=>{if(t.estado==='aprobada'&&t.audio&&AUD[t.id]){const k=t.cam?String(t.cam):'_';(cams[k]=cams[k]||[]).push(t)}});
  const hayAud=S.tomas.some(t=>t.audio&&AUD[t.id]);
  $('camShare').innerHTML=Object.keys(cams).sort((x,y)=>(x==='_')-(y==='_')||x-y).map(c=>{const l=cams[c],pend=l.filter(t=>!t.enviada).length;return `<button data-share="${c}" class="${pend?'':'ya'}">${pend?'📤':'✓'} ${c==='_'?'Audios':'CAM '+c} · ${l.length} audio${l.length>1?'s':''} · ${kb(l.reduce((s,t)=>s+t.audio.bytes,0))}${pend?'':' · enviada'}</button>`}).join('')+(hayAud?'<button data-respaldo class="gris">🛟 Respaldo (todo)</button>':'');
  const pend=pendientes(),av=$('aviso');
  if(pend.length&&!S.act){const m=S.respaldo?Math.round((Date.now()-S.respaldo)/60000):null;av.textContent='⚠ '+pend.length+' audio'+(pend.length>1?'s':'')+' sin enviar · respaldo: '+(m==null?'nunca':'hace '+m+' min');av.classList.remove('hide')}else av.classList.add('hide');
  const rs=$('rescate');
  if(S.rescate){const r=S.rescate;rs.classList.remove('hide');rs.innerHTML=`<b>♻ Toma interrumpida · ${esc(etiqueta(r.esc,r.cam))}</b><div class="sub" style="text-align:left">Se cortó la app en plena toma (hasta ${fmt(Math.max(0,((r.ult||r.t0)-r.t0)/1000))}). El audio y los marcadores se pueden recuperar.</div><div class="row"><button data-rec>♻ Recuperar</button><button data-nores class="bad">Descartar</button></div>`}else rs.classList.add('hide');
  const ts=S.tomas.slice().reverse();
  $('regT').textContent='REGISTRO · '+S.tomas.filter(t=>t.estado==='aprobada').length+' aprobadas de '+S.tomas.length;
  $('reg').innerHTML=ts.length?ts.map(t=>`<div class="reg${t.estado==='aprobada'?'':' no'}"><div><span class="n">${esc(t.nombre)}</span><div class="m">${fmt(t.duracion_seg)} · ${t.marcadores.length} marc. · sync ${t.sincro} · ${t.audio?kb(t.audio.bytes):'sin audio'}${t.enviada?' · ✓ enviada':''}${t.huecos?' · ⚠ hueco':''}${t.recuperada?' · ♻':''}</div></div><button data-est="${t.id}" class="${t.estado==='aprobada'?'a':''}">${t.estado==='aprobada'?'✔':'✖'}</button><button class="d" data-delt="${t.id}">✕</button></div>`).join(''):'<div class="sub" style="text-align:left">Todavía no hay tomas.</div>';
  $('pNum').value=S.prog.num;$('pFecha').value=S.prog.fecha;$('pNom').value=S.prog.nom;$('umbral').value=Math.round(S.umbral*100);
}

/* ---------- Exportar ---------- */
function build(){
  const d=new Date();
  return {formato:'crudo-tomas',version:3,generado:isoLocal(d),zona_horaria_min:-d.getTimezoneOffset(),
    programa:{numero:S.prog.num,nombre:S.prog.nom,fecha:S.prog.fecha},
    nota:'t_seg y palmadas_seg se miden desde la 3ª palmada (t=0). inicio = hora de pared de esa palmada. audio.offset_seg = segundos desde el inicio del archivo de audio hasta la 3ª palmada.',
    tomas:S.tomas};
}
function nombreArchivo(){return 'tomas_'+(S.prog.fecha||hoy())+'_'+((S.prog.num||'prog').replace(/[^\w-]/g,''))+'.json'}
async function exportar(){
  if(S.act){toast('Terminá la toma antes de exportar');return}
  const name=nombreArchivo(),file=new File([JSON.stringify(build(),null,2)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Descargado: '+name);
}
async function copiar(){try{await navigator.clipboard.writeText(JSON.stringify(build(),null,2));toast('JSON copiado')}catch(e){toast('No se pudo copiar, usá Exportar')}}

/* ---------- Eventos ---------- */
if(typeof document!=='undefined'&&$('go')){
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='go'){if(!S.act)iniciar();else if(S.act.fase==='esperando')cancelar();else finalizar();return}
    if(b.id==='man')return manual();
    if(b.dataset.mk)return addMk(b.dataset.mk);
    if(b.id==='back'){S.back=!S.back;return render()}
    if(b.dataset.del){S.act.mk=S.act.mk.filter(m=>m.id!=b.dataset.del);save();return render()}
    if(b.dataset.est){const t=S.tomas.find(x=>x.id==b.dataset.est);if(t){t.estado=t.estado==='aprobada'?'descartada':'aprobada';save();render()}return}
    if(b.dataset.share)return compartirCam(b.dataset.share);
    if(b.dataset.respaldo!==undefined)return respaldo();
    if(b.dataset.rec!==undefined)return recuperar();
    if(b.dataset.nores!==undefined)return descartarRescate();
    if(b.dataset.delt){if(confirm((()=>{const tt=S.tomas.find(x=>x.id==b.dataset.delt);return tt&&tt.audio&&!tt.enviada?'Esta toma tiene audio SIN ENVIAR. ¿Borrar igual?':'¿Borrar esta toma del registro?'})())){aDel(+b.dataset.delt);S.tomas=S.tomas.filter(x=>x.id!=b.dataset.delt);save();render()}return}
    if(b.id==='exportar')return exportar();
    if(b.id==='copiar')return copiar();
    if(b.id==='borrar'){
      const p=pendientes().length;
      const ok=p?((prompt('⚠ Hay '+p+' audio(s) sin enviar. Si querés borrar igual, escribí BORRAR')||'').trim().toUpperCase()==='BORRAR'):confirm('¿Borrar todas las tomas del día?');
      if(ok){S.tomas=[];S.act=null;S.rescate=null;S.respaldo=0;parar();recCancel();wakeOff();alerta('');aClear();cClear();clearInterval(TICK);save();render()}
      return}
    if(b.id==='probar'){
      if(S.act)return toast('Terminá la toma primero');
      micOn().then(ok=>{if(!ok)return toast('No hay permiso de micrófono');
        if(LOOP){parar();return toast('Prueba detenida')}
        toast('Aplaudí 3 veces…');Det.reset();CB=()=>{parar();toast('✔ 3 palmadas detectadas')};bucle()});return}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='cam'){
      if(t.value==='otra'){const v=(prompt('Número de CAM')||'').trim();if(/^\d{1,2}$/.test(v)){const n=String(+v);if(!(S.extra||[]).includes(n)&&+n>10)S.extra=(S.extra||[]).concat(n);S.cam=n}else S.cam=''}
      else S.cam=t.value;
      save();render();return}
    if(t.id==='esc'){
      if(t.value==='otra'){const v=(prompt('Número de ESCENA')||'').trim();if(/^\d{1,3}$/.test(v)&&+v>0){const n=String(+v);if(!(S.extraEsc||[]).includes(n)&&+n>30)S.extraEsc=(S.extraEsc||[]).concat(n);S.esc=n}}
      else S.esc=t.value;
      save();render();return}
    if(t.dataset.acc&&S.act){const m=S.act.mk.find(x=>x.id==t.dataset.acc);if(m){m.accion=t.value;save()}}
  });
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden)wakeOn();
    if(!S.act)return;
    if(document.hidden){S.act.oculto=Date.now();save();return}
    wakeOn();
    try{if(AC&&AC.state!=='running')AC.resume()}catch(e){}
    try{if(REC&&REC.state==='paused')REC.resume()}catch(e){}
    if(S.act.oculto){
      const d=(Date.now()-S.act.oculto)/1000;
      (S.act.huecos=S.act.huecos||[]).push({t_seg:+((S.act.oculto-(S.act.t0||S.act.oculto))/1000).toFixed(2),dur_seg:+d.toFixed(1)});
      S.act.oculto=null;save();
      if(d>1)alerta('⚠ La app estuvo en segundo plano '+Math.round(d)+' s: puede faltar audio ahí');
    }
  });
  window.addEventListener('beforeunload',e=>{if(S.act||pendientes().length){e.preventDefault();e.returnValue=''}});
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.det&&S.act){const m=S.act.mk.find(x=>x.id==t.dataset.det);if(m){m.detalle=t.value;save()}return}
    if(t.id==='pNum')S.prog.num=t.value.trim();
    else if(t.id==='pFecha')S.prog.fecha=t.value;
    else if(t.id==='pNom')S.prog.nom=t.value;
    else if(t.id==='umbral')S.umbral=(+t.value||35)/100;
    else return;
    save();$('prg').textContent=(S.prog.num?'Nº '+S.prog.num+' · ':'')+S.prog.fecha;
  });
  ['pointerdown','touchstart','click'].forEach(ev=>document.addEventListener(ev,()=>{if(!WL)wakeOn()},{passive:true}));
  wakeOn();
  load();
  const viejo=S.act;
  if(viejo){S.act=null;if(viejo.t0)S.rescate=viejo;save()}
  render();
  aLoad().then(()=>cClear(S.rescate?S.rescate.pulsado:null)).then(render);
  stInfo();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().then(stInfo)}catch(e){}
  setInterval(()=>{const d=new Date();$('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())},250);
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
