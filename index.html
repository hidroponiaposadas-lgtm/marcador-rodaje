<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marcador">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marcador de Rodaje · CRUDO</title>
<style>
/* Paleta en variables: cambiar acá para igualar la estética exacta de CRUDO Suite */
:root{--bg:#0b0d10;--card:#13171c;--line:#222833;--tx:#e8ebf0;--mut:#7d8696;--ac:#ff7a1a;--ok:#2fbf71;--bad:#e5484d;--blue:#4aa3ff;--warn:#f5c542;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(8px,env(safe-area-inset-top)) 10px calc(64px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px;letter-spacing:.6px}
.top b{color:var(--ac)}
#clock{font:700 44px/1 var(--mono);text-align:center;margin:6px 0 8px;letter-spacing:1px}
button,select,input{font:inherit;color:var(--tx)}
button{background:#1a2029;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600}
button:active{transform:scale(.97)}
select,input{background:#0e1216;border:1px solid var(--line);border-radius:10px;padding:9px;width:100%}
.ctl{display:grid;grid-template-columns:104px 1fr;gap:10px;margin-top:8px}
.ctl select{font-size:22px;font-weight:800;padding:0 8px;border-radius:14px}
#go{background:var(--ac);border-color:var(--ac);color:#1a0d00;font-size:24px;font-weight:800;padding:24px 12px;border-radius:14px;letter-spacing:.5px}
#go.esp{background:#2a1d10;color:var(--ac);border-color:var(--ac)}
#go.rec{background:var(--bad);border-color:var(--bad);color:#fff}
#estado{margin:8px 0 0;min-height:0}
.esp-box{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dots{display:flex;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}
.dot.on{background:var(--ac);border-color:var(--ac)}
#meter{height:5px;background:#1a2029;border-radius:9px;overflow:hidden;margin-top:8px}
#meter i{display:block;height:100%;width:0;background:var(--ok)}
#cron{font:800 54px/1 var(--mono);text-align:center;color:var(--ok)}
.sub{text-align:center;color:var(--mut);font-size:12px;margin-top:2px}
#tl{position:relative;height:30px;margin:10px 0 8px;background:#0e1216;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ac)}
.tk{position:absolute;top:4px;bottom:4px;width:4px;border-radius:2px;margin-left:-2px}
#quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#quick button{padding:26px 6px;font-size:20px;font-weight:800;border-radius:14px;border:0;color:#10131a}
#quick [data-mk=CORTAR_FRASE]{background:#ff7a1a}
#quick [data-mk=TAPAR_INSERT]{background:#4aa3ff}
#quick [data-mk=DESTACAR]{background:#f5c542}
#quick [data-mk=NOTA]{background:#9aa3b2}
#quick #back{grid-column:1/3;padding:14px;font-size:17px;background:#1a2029;color:var(--tx);border:1px solid var(--line)}
#quick #back.sel{border-color:var(--ac);color:var(--ac)}
.mk{display:grid;grid-template-columns:52px 1fr auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.mk .t{font:12px var(--mono);color:var(--mut)}
.mk input{padding:7px}
.mk .x{padding:5px 9px;color:var(--bad)}
.chip{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;margin-right:4px;color:#10131a}
h2{font-size:12px;margin:16px 0 4px;color:var(--mut);letter-spacing:.8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.reg{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.reg .n{font-weight:700}.reg .m{color:var(--mut);font-size:11px}
.reg button{padding:4px 9px}
.reg .d{color:var(--bad)}
.reg.no{opacity:.45}
.reg .a{color:var(--ok)}
details{margin-top:12px;color:var(--mut)}
details summary{cursor:pointer;font-size:12px;letter-spacing:.6px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.f label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0b0d10ee;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:560px;margin:0 auto}
.bar button{flex:1}
.bar .ex{background:var(--ac);color:#1a0d00;border-color:var(--ac);flex:2}
#ok{position:fixed;inset:0;background:var(--ok);color:#04210f;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
#ok b{font-size:38px;letter-spacing:1px}
#ok span{font:600 18px var(--mono);margin-top:10px}
#toast{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:#000;border:1px solid var(--ac);padding:8px 14px;border-radius:10px;z-index:30;display:none;max-width:90%;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="toast"></div>
<div id="ok"><b>✔ TOMA APROBADA</b><span id="okInfo"></span></div>

<div class="top"><span><b>CRUDO</b> · MARCADOR DE RODAJE</span><span id="prg"></span></div>
<div id="clock">--:--:--</div>

<div id="estado"></div>

<div class="ctl">
  <select id="cam" aria-label="Cámara"></select>
  <button id="go">INICIO TOMA</button>
</div>

<div id="rec" class="hide">
  <div id="tl"><div id="ph"></div></div>
  <div id="quick">
    <button data-mk="CORTAR_FRASE">✂ Cortar</button>
    <button data-mk="TAPAR_INSERT">🎞 Tapar</button>
    <button data-mk="DESTACAR">⭐ Destacar</button>
    <button data-mk="NOTA">📝 Nota</button>
    <button id="back" title="El próximo marcador cae 5 segundos antes">⏪ El próximo marcador, 5 s antes</button>
  </div>
  <div id="mkl"></div>
</div>

<h2><span id="regT">REGISTRO</span></h2>
<div id="reg"></div>

<details>
  <summary>AJUSTES</summary>
  <div class="f">
    <div><label>Programa Nº</label><input id="pNum" inputmode="numeric" placeholder="1326"></div>
    <div><label>Fecha</label><input id="pFecha" type="date"></div>
    <div style="grid-column:1/3"><label>Programa</label><input id="pNom"></div>
    <div style="grid-column:1/3"><label>Sensibilidad de palmadas (más a la izquierda = detecta más suave)</label><input id="umbral" type="range" min="10" max="80" step="5"></div>
    <button id="probar">Probar micrófono</button>
    <button id="borrar" style="color:var(--bad)">Borrar día</button>
  </div>
</details>

<div class="bar">
  <button id="copiar">Copiar</button>
  <button class="ex" id="exportar">⬇ EXPORTAR PARA CRUDO / FRANCO</button>
</div>

<script>
const KEY='crudo_marcador_v2';
const TIPOS={CORTAR_FRASE:{n:'✂ Cortar',c:'#ff7a1a',ph:'frase exacta, ej: quiero queso'},TAPAR_INSERT:{n:'🎞 Tapar',c:'#4aa3ff',ph:'insert, ej: lluvia'},DESTACAR:{n:'⭐ Dest.',c:'#f5c542',ph:'detalle (opcional)'},NOTA:{n:'📝 Nota',c:'#9aa3b2',ph:'nota'}};
const pad=n=>String(n).padStart(2,'0');
const $=id=>document.getElementById(id);
function hoy(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function isoLocal(d){const o=-d.getTimezoneOffset(),s=o>=0?'+':'-',a=Math.abs(o);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0')+s+pad(Math.floor(a/60))+':'+pad(a%60)}
function fmt(s){s=Math.max(0,s);const m=Math.floor(s/60),x=s-m*60;return pad(m)+':'+x.toFixed(1).padStart(4,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=$('toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2200)}

let S={prog:{num:'',nom:'Nuestro Agro',fecha:hoy()},umbral:.35,extra:[],cam:'',tomas:[],seq:1,act:null,back:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}

/* ---------- Detector de 3 palmadas (puro, testeable) ---------- */
const Det={on:[],last:0,armed:true,rms:0.01,
  reset(){this.on=[];this.last=0;this.armed=true},
  feed(p,rms,now,umbral){
    if(p<umbral*0.5)this.armed=true;
    const hot=p>umbral&&p>this.rms*6;
    if(!hot)this.rms=this.rms*0.95+rms*0.05;
    if(hot&&this.armed&&now-this.last>=130){
      this.armed=false;this.last=now;
      this.on.push(now);this.on=this.on.filter(t=>now-t<=3500);
      if(this.on.length>=3){
        const a=this.on.slice(-3);
        if(a[1]-a[0]<=1600&&a[2]-a[1]<=1600){this.on=[];return a}
      }
    }
    return null;
  }
};

/* ---------- Micrófono ---------- */
let AC=null,AN=null,ST=null,LOOP=null;
async function micOn(){
  if(AN){try{if(AC.state==='suspended')await AC.resume()}catch(e){}return true}
  try{
    ST=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const src=AC.createMediaStreamSource(ST);AN=AC.createAnalyser();AN.fftSize=1024;src.connect(AN);
    if(AC.state==='suspended')await AC.resume();
    return true;
  }catch(e){return false}
}
function escuchar(cb){
  pararEscucha();Det.reset();
  const buf=new Float32Array(1024);
  LOOP=setInterval(()=>{
    AN.getFloatTimeDomainData(buf);
    let p=0,s=0;for(let i=0;i<buf.length;i++){const a=Math.abs(buf[i]);if(a>p)p=a;s+=a*a}
    const m=$('mtr');if(m)m.style.width=Math.min(100,p*100)+'%';
    const r=Det.feed(p,Math.sqrt(s/buf.length),Date.now(),S.umbral);
    pintarDots();
    if(r){pararEscucha();cb(r)}
  },8);
}
function pararEscucha(){if(LOOP){clearInterval(LOOP);LOOP=null}}

/* ---------- Pantalla encendida (Wake Lock) ---------- */
let WL=null;
async function wakeOn(){try{if('wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
function wakeOff(){try{if(WL)WL.release()}catch(e){}WL=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.act)wakeOn()});

/* ---------- Flujo de toma ---------- */
let TICK=null;
async function iniciar(){
  if(!S.cam){toast('Elegí el número de CAM');$('cam').focus();return}
  if(S.act)return;
  S.act={cam:S.cam,fase:'esperando',pulsado:Date.now(),claps:[],t0:null,metodo:null,mk:[]};
  render();wakeOn();
  const ok=await micOn();
  if(!ok){toast('Sin micrófono: usá "Palmada manual"');return}
  if(!S.act||S.act.fase!=='esperando')return;
  escuchar(r=>sincronizado(r,'audio'));
}
function sincronizado(claps,metodo){
  if(!S.act)return;
  S.act.claps=claps;S.act.t0=claps.length?claps[claps.length-1]:Date.now();S.act.metodo=metodo;S.act.fase='grabando';
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  save();render();arrancarTick();
}
function manual(){sincronizado([],'manual')}
function cancelar(){pararEscucha();wakeOff();S.act=null;save();render()}
function secs(){return (Date.now()-S.act.t0)/1000}
function arrancarTick(){clearInterval(TICK);TICK=setInterval(tick,100);tick()}
function tick(){
  if(!S.act||S.act.fase!=='grabando'||!$('cron'))return;
  const t=secs();$('cron').textContent=fmt(t);
  const win=Math.max(60,t);
  $('ph').style.left=Math.min(100,t/win*100)+'%';
  document.querySelectorAll('.tk').forEach(e=>{e.style.left=(+e.dataset.t/win*100)+'%'});
}
function addMk(tipo){
  if(!S.act||S.act.fase!=='grabando')return;
  let t=secs()-(S.back?5:0);if(t<0)t=0;S.back=false;
  S.act.mk.push({id:S.seq++,t:+t.toFixed(2),tipo,detalle:'',accion:tipo==='CORTAR_FRASE'?'quitar':undefined});
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  save();render();
}
function nombre(cam,n){return (S.prog.num||'PROG')+'_CAM'+cam+'_T'+pad(n)}
function finalizar(){
  const a=S.act;if(!a||a.fase!=='grabando')return;
  clearInterval(TICK);wakeOff();
  const dur=secs();
  const n=S.tomas.filter(t=>t.cam===a.cam).length+1;
  const toma={id:S.seq++,cam:a.cam,n,nombre:nombre(a.cam,n),estado:'aprobada',
    inicio:isoLocal(new Date(a.t0)),pulsado:isoLocal(new Date(a.pulsado)),
    sincro:a.metodo,palmadas_seg:a.claps.map(c=>+((c-a.t0)/1000).toFixed(3)),
    duracion_seg:+dur.toFixed(2),
    marcadores:a.mk.slice().sort((x,y)=>x.t-y.t).map(m=>{const r={t_seg:m.t,tipo:m.tipo,detalle:m.detalle||''};if(m.accion)r.accion=m.accion;return r})};
  S.tomas.push(toma);S.act=null;S.back=false;save();render();aprobada(toma);
}
function aprobada(t){
  const o=$('ok');if(!o)return;
  $('okInfo').textContent=t.nombre+' · '+fmt(t.duracion_seg);
  o.style.display='flex';clearTimeout(aprobada._t);aprobada._t=setTimeout(()=>o.style.display='none',1800);
  try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
}

/* ---------- Render ---------- */
function pintarDots(){
  const n=Det.on.length;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<n));
}
function opcionesCam(){
  const nums=[];for(let i=1;i<=10;i++)nums.push(String(i));
  (S.extra||[]).forEach(x=>{if(!nums.includes(x))nums.push(x)});
  return '<option value="">CAM</option>'+nums.map(n=>`<option value="${n}"${S.cam===n?' selected':''}>${n}</option>`).join('')+'<option value="otra">Otra…</option>';
}
function render(){
  if(!$('go'))return;
  const a=S.act;
  $('prg').textContent=(S.prog.num?'Nº '+S.prog.num+' · ':'')+S.prog.fecha;
  $('cam').innerHTML=opcionesCam();$('cam').disabled=!!a;
  const go=$('go');
  if(!a){go.textContent='INICIO TOMA';go.className='';}
  else if(a.fase==='esperando'){go.textContent='CANCELAR';go.className='esp';}
  else{go.textContent='FIN TOMA';go.className='rec';}
  const est=$('estado');
  if(a&&a.fase==='esperando'){
    est.innerHTML=`<div class="esp-box"><div><b>CAM ${esc(a.cam)}</b> <span class="sub">esperando 3 palmadas…</span></div><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><button id="man">Palmada manual</button></div><div id="meter"><i id="mtr"></i></div>`;
    pintarDots();
  }else if(a){
    est.innerHTML=`<div id="cron">00:00.0</div><div class="sub">CAM ${esc(a.cam)} · toma ${S.tomas.filter(t=>t.cam===a.cam).length+1} · sync ${a.metodo==='audio'?'por palmadas ✔':'manual'}</div>`;
  }else est.innerHTML='';
  $('rec').classList.toggle('hide',!(a&&a.fase==='grabando'));
  if(a&&a.fase==='grabando'){
    document.querySelectorAll('#quick [data-mk]').forEach(b=>b.classList.remove('sel'));
    $('back').classList.toggle('sel',!!S.back);
    $('tl').innerHTML='<div id="ph"></div>'+a.mk.map(m=>`<i class="tk" data-t="${m.t}" style="background:${TIPOS[m.tipo].c}"></i>`).join('');
    $('mkl').innerHTML=a.mk.slice().reverse().map(m=>`<div class="mk" data-id="${m.id}"><span class="t">${fmt(m.t)}</span><span style="display:flex;gap:4px;align-items:center"><span class="chip" style="background:${TIPOS[m.tipo].c}">${TIPOS[m.tipo].n}</span>${m.tipo==='CORTAR_FRASE'?`<select data-acc="${m.id}" style="width:auto;padding:6px"><option value="quitar"${m.accion==='quitar'?' selected':''}>quitar</option><option value="conservar"${m.accion==='conservar'?' selected':''}>dejar</option></select>`:''}<input data-det="${m.id}" value="${esc(m.detalle)}" placeholder="${esc(TIPOS[m.tipo].ph)}"></span><button class="x" data-del="${m.id}">✕</button></div>`).join('');
    tick();
  }
  const ts=S.tomas.slice().reverse();
  $('regT').textContent='REGISTRO · '+S.tomas.filter(t=>t.estado==='aprobada').length+' aprobadas de '+S.tomas.length;
  $('reg').innerHTML=ts.length?ts.map(t=>`<div class="reg${t.estado==='aprobada'?'':' no'}"><div><span class="n">${esc(t.nombre)}</span><div class="m">${fmt(t.duracion_seg)} · ${t.marcadores.length} marc. · sync ${t.sincro}</div></div><button data-est="${t.id}" class="${t.estado==='aprobada'?'a':''}">${t.estado==='aprobada'?'✔':'✖'}</button><button class="d" data-delt="${t.id}">✕</button></div>`).join(''):'<div class="sub" style="text-align:left">Todavía no hay tomas.</div>';
  $('pNum').value=S.prog.num;$('pFecha').value=S.prog.fecha;$('pNom').value=S.prog.nom;$('umbral').value=Math.round(S.umbral*100);
}

/* ---------- Exportar ---------- */
function build(){
  const d=new Date();
  return {formato:'crudo-tomas',version:2,generado:isoLocal(d),zona_horaria_min:-d.getTimezoneOffset(),
    programa:{numero:S.prog.num,nombre:S.prog.nom,fecha:S.prog.fecha},
    nota:'t_seg y palmadas_seg se miden desde la 3ª palmada (t=0). inicio = hora de pared de esa palmada.',
    tomas:S.tomas};
}
function nombreArchivo(){return 'tomas_'+(S.prog.fecha||hoy())+'_'+((S.prog.num||'prog').replace(/[^\w-]/g,''))+'.json'}
async function exportar(){
  if(S.act){toast('Terminá la toma antes de exportar');return}
  const name=nombreArchivo(),file=new File([JSON.stringify(build(),null,2)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Descargado: '+name);
}
async function copiar(){try{await navigator.clipboard.writeText(JSON.stringify(build(),null,2));toast('JSON copiado')}catch(e){toast('No se pudo copiar, usá Exportar')}}

/* ---------- Eventos ---------- */
if(typeof document!=='undefined'&&$('go')){
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='go'){if(!S.act)iniciar();else if(S.act.fase==='esperando')cancelar();else finalizar();return}
    if(b.id==='man')return manual();
    if(b.dataset.mk)return addMk(b.dataset.mk);
    if(b.id==='back'){S.back=!S.back;return render()}
    if(b.dataset.del){S.act.mk=S.act.mk.filter(m=>m.id!=b.dataset.del);save();return render()}
    if(b.dataset.est){const t=S.tomas.find(x=>x.id==b.dataset.est);if(t){t.estado=t.estado==='aprobada'?'descartada':'aprobada';save();render()}return}
    if(b.dataset.delt){if(confirm('¿Borrar esta toma del registro?')){S.tomas=S.tomas.filter(x=>x.id!=b.dataset.delt);save();render()}return}
    if(b.id==='exportar')return exportar();
    if(b.id==='copiar')return copiar();
    if(b.id==='borrar'){if(confirm('¿Borrar todas las tomas del día?')){S.tomas=[];S.act=null;pararEscucha();clearInterval(TICK);save();render()}return}
    if(b.id==='probar'){
      micOn().then(ok=>{if(!ok)return toast('No hay permiso de micrófono');
        if(LOOP){pararEscucha();return toast('Prueba detenida')}
        toast('Aplaudí 3 veces…');escuchar(()=>toast('✔ 3 palmadas detectadas'))});return}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='cam'){
      if(t.value==='otra'){const v=(prompt('Número de CAM')||'').trim();if(/^\d{1,2}$/.test(v)){const n=String(+v);if(!(S.extra||[]).includes(n)&&+n>10)S.extra=(S.extra||[]).concat(n);S.cam=n}else S.cam=''}
      else S.cam=t.value;
      save();render();return}
    if(t.dataset.acc&&S.act){const m=S.act.mk.find(x=>x.id==t.dataset.acc);if(m){m.accion=t.value;save()}}
  });
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.det&&S.act){const m=S.act.mk.find(x=>x.id==t.dataset.det);if(m){m.detalle=t.value;save()}return}
    if(t.id==='pNum')S.prog.num=t.value.trim();
    else if(t.id==='pFecha')S.prog.fecha=t.value;
    else if(t.id==='pNom')S.prog.nom=t.value;
    else if(t.id==='umbral')S.umbral=(+t.value||35)/100;
    else return;
    save();$('prg').textContent=(S.prog.num?'Nº '+S.prog.num+' · ':'')+S.prog.fecha;
  });
  load();
  if(S.act&&S.act.fase==='esperando')S.act=null;
  render();
  if(S.act&&S.act.fase==='grabando')arrancarTick();
  setInterval(()=>{const d=new Date();$('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())},250);
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
